name: Difusión en redes

# Cuando se publican artículos nuevos en main (al fusionar la edición del día),
# genera el "kit de posts" para copiar y pegar y, si hay bot de Telegram
# configurado, publica en el canal. También se puede lanzar a mano.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/articulos/**'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar solo un post de PRUEBA a Telegram (para comprobar que funciona)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: difusion
  cancel-in-progress: false

jobs:
  difusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Enviar post de PRUEBA a Telegram
        if: ${{ inputs.prueba }}
        env:
          DOMINIO: ${{ vars.DOMINIO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run difusion -- --test

      - name: Generar kit de difusión y publicar en Telegram (si está configurado)
        if: ${{ !inputs.prueba }}
        env:
          DOMINIO: ${{ vars.DOMINIO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run difusion -- --publicar

      - name: Generar carruseles para Instagram y TikTok
        if: ${{ !inputs.prueba }}
        run: npx tsx scripts/carruseles.ts

      - name: Guardar el kit, los carruseles y el registro de difusión
        if: ${{ !inputs.prueba }}
        run: |
          git config user.name "Bolsillo Diario bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A datos/difusion-ultima.md datos/difundidos.json public/redes
          git commit -m "Kit de difusión del día" || { echo "Sin cambios de difusión"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && break || { echo "reintento $i"; sleep $((2**i)); }
          done

      - name: Avisar a Bing y otros buscadores (IndexNow)
        if: ${{ !inputs.prueba }}
        env:
          DOMINIO: ${{ vars.DOMINIO }}
        run: |
          # Damos tiempo a Cloudflare Pages a publicar la versión nueva antes de avisar.
          sleep 240
          npx tsx scripts/indexnow.mts || echo "IndexNow no respondió bien; se reintentará en la próxima edición"
