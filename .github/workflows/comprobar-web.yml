name: Comprobar que la web responde

# Prueba desde fuera (servidores de GitHub) que tubolsillodiario.com carga, para
# distinguir una caída de la web de un bloqueo en la conexión de quien la visita.
on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir las páginas principales
        run: |
          for ruta in / /ads.txt /calculadoras/irpf/ /redes/ /articulo/tesla-roadster-volador-todo-lo-que-ha-presentado-elon-musk/ /articulo/bolsa-beam-2026-10-26/; do
            curl -sS -o /dev/null -m 20 -w "%{http_code} %{time_total}s https://tubolsillodiario.com$ruta (IP %{remote_ip})\n" "https://tubolsillodiario.com$ruta" || echo "FALLO https://tubolsillodiario.com$ruta"
          done
          echo "--- portada enlaza a tesla:"; curl -sS -m 20 https://tubolsillodiario.com/ | grep -o "tesla-roadster[a-z-]*" | head -2 || true
          echo "--- ads.txt:"; curl -sS -m 20 https://tubolsillodiario.com/ads.txt || true
          echo "--- DNS:"; dig +short tubolsillodiario.com || true
          echo "--- Vista previa en redes (robots de X, Facebook y WhatsApp):"
          ART=https://tubolsillodiario.com/articulo/jensen-huang-nvidia-infidelidad-presunta-espia-china-acciones/
          for ua in "Twitterbot/1.0" "facebookexternalhit/1.1" "WhatsApp/2.23"; do
            curl -sS -o /tmp/pagina.html -m 20 -A "$ua" -w "$ua pagina: %{http_code}\n" "$ART" || echo "$ua pagina: FALLO"
            grep -o '<meta name="twitter:image"[^>]*>' /tmp/pagina.html | head -1 || true
            IMG=$(grep -o 'property="og:image" content="[^"]*"' /tmp/pagina.html | head -1 | sed 's/.*content="//;s/"$//')
            [ -n "$IMG" ] && curl -sS -o /dev/null -m 20 -A "$ua" -w "$ua imagen: %{http_code} %{content_type} %{size_download} bytes\n" "$IMG" || true
          done
